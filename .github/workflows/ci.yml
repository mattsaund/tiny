# The three platforms tiny claims to run on, on every push.
#
# The claim is the point. tiny is developed on Linux, so "it works on Windows
# and macOS" is otherwise a thing nobody has watched happen, and the ways it
# breaks are exactly the ones a Linux machine cannot show you: a `\` where a `/`
# was expected, a temp directory that is a symlink, a short name like
# `RUNNER~1`, a shell that turns stderr into an error.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes anything back; only the release workflow needs to.
permissions:
  contents: read

# A second push while the first is still building makes the first answer moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform runs even when one fails: which ones broke is the
      # information worth having.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The git window shells out to git, and its tests build real
      # repositories. A committer has to exist for `git commit` to work, and
      # the runners do not set one globally.
      - name: Give git a name
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      # The terminal tests (`tests/terminals.rs`) run tiny inside tmux and GNU
      # screen as well: terminals of their own between tiny and the screen,
      # and the only ones that run without a desktop. Not on every runner.
      - name: Install tmux and GNU screen
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux screen
      - name: Install tmux and GNU screen
        if: runner.os == 'macOS'
        run: brew install tmux screen

      # `--locked` everywhere: without it cargo quietly re-resolves, so a
      # Cargo.lock that has fallen behind Cargo.toml passes every check here
      # and then fails the tagged release build, which is the one build that
      # cannot simply be run again.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release

      # The docs are half this codebase and they can break: an intra-doc link
      # to something that has been renamed is a warning, and warnings are easy
      # to walk past locally. Not on the matrix by accident: some items are
      # behind `cfg(windows)`, and their links only resolve where they compile.
      - name: Check the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items

  # `rust-version` in Cargo.toml is a promise, and `install.sh` will build with
  # whatever `cargo` it finds, including the older one a distribution ships.
  # This is the job that keeps the promise true.
  msrv:
    name: build on the oldest Rust we claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read from the manifest rather than written down again here, so the
      # version cannot be raised in one place and not the other.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | tr -d '"[:space:]' | cut -d= -f2)
          echo "claimed: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --locked --all-targets

  installers:
    name: parse the installers on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Parse install.sh
        if: runner.os != 'Windows'
        # `sh -n` on the platform's own shell: dash on Linux, bash-as-sh on
        # macOS. A GNU-only spelling fails here rather than on someone's Mac.
        run: sh -n install.sh

      # Both PowerShells. 5.1 is the one every copy of Windows has, and it
      # reads a script file differently from 7, which is how a script that
      # parsed perfectly in 7 could still fail on a real machine.
      - name: Parse install.ps1 in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'install.ps1 parses in PowerShell 7'

      - name: Parse install.ps1 in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'install.ps1 parses in Windows PowerShell 5.1'

      - name: Keep install.ps1 plain ASCII
        if: runner.os != 'Windows'
        # 5.1 reads a local .ps1 in the ANSI code page, where one byte of a
        # UTF-8 em dash is a curly quote that ends a string early.
        run: |
          if LC_ALL=C grep -n '[^ -~]' install.ps1; then
            echo "install.ps1 must be plain ASCII (lines above)"; exit 1
          fi

  # The installers end to end, the way someone would run them: from a
  # directory that is not the checkout, so they take the real path: download
  # the release if there is one, otherwise clone the branch and build it.
  # Pushes only, because a pull request's merge ref is not a branch the
  # installer can clone by name.
  install-windows:
    name: install on Windows (PowerShell 5.1)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run install.ps1
        shell: powershell
        env:
          TINY_REF: ${{ github.ref_name }}
          TINY_PREFIX: ${{ runner.temp }}\tinybin
          # Build, do not download. Once a release exists the installer would
          # rightly prefer it, and this job would quietly stop testing the
          # commit that was just pushed, which is the whole point of it.
          TINY_FROM_SOURCE: 1
        run: |
          Set-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\install.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:TINY_PREFIX\tiny.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # tiny in the Start menu, offered by "Open with" for text, and wearing
      # its own icon; then all of that gone after an uninstall. Windows keeps
      # a program that is running, so the uninstall says it could not remove
      # tiny.exe itself and fails: what is checked is that the rest went.
      - name: Check the Start menu and Open with, and that an uninstall takes them
        shell: powershell
        env:
          TINY_PREFIX: ${{ runner.temp }}\tinybin
        run: |
          $exe = Join-Path $env:TINY_PREFIX 'tiny.exe'
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'tiny.lnk'
          if (-not (Test-Path $link)) { throw 'no Start menu shortcut' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if ($shortcut.TargetPath -ne $exe -or $shortcut.Arguments -ne '--hide-browser') {
            throw "the shortcut starts $($shortcut.TargetPath) $($shortcut.Arguments)"
          }
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\Applications\tiny.exe\shell\open\command').'(default)'
          if ($command -ne ('"' + $exe + '" --hide-browser "%1"')) { throw "Open with runs $command" }
          $with = Get-ItemProperty 'HKCU:\Software\Classes\.md\OpenWithProgids'
          if ($null -eq $with.'tiny.text') { throw '.md files are not offered tiny' }
          # Its icon: green where the disk is, beside the t.
          Add-Type -AssemblyName System.Drawing
          $pixel = [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().GetPixel(8, 22)
          Write-Host "tiny.exe's icon at (8, 22): $pixel"
          if (-not ($pixel.G -gt 100 -and $pixel.R -lt 100 -and $pixel.B -lt 110)) { throw 'tiny.exe does not wear its icon' }
          # The answer from cmd, which sends it as the bytes typed.
          cmd /c "echo y| `"$exe`" --uninstall"
          if (Test-Path $link) { throw 'the shortcut is still there' }
          if (Test-Path 'HKCU:\Software\Classes\Applications\tiny.exe') { throw 'Open with still has tiny' }
          $with = Get-ItemProperty 'HKCU:\Software\Classes\.md\OpenWithProgids' -ErrorAction SilentlyContinue
          if ($with -and $null -ne $with.'tiny.text') { throw '.md files are still offered tiny' }
          exit 0

  install-macos:
    name: install on macOS
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run install.sh
        env:
          TINY_REF: ${{ github.ref_name }}
          TINY_PREFIX: ${{ runner.temp }}/tinybin
          # Build rather than download, for the reason above.
          TINY_FROM_SOURCE: 1
        run: |
          cd "$RUNNER_TEMP"
          sh "$GITHUB_WORKSPACE/install.sh"
          "$TINY_PREFIX/tiny" --version
      # tiny.app: built, signed, saying what it opens and which tiny it
      # starts, with its icon and the launcher it runs.
      - name: Check tiny.app
        env:
          TINY_PREFIX: ${{ runner.temp }}/tinybin
        run: |
          app="$HOME/Applications/tiny.app"
          plist="$app/Contents/Info.plist"
          plutil -lint "$plist"
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = dev.msaunders.tiny
          test "$(plutil -extract TinyBinary raw -o - "$plist")" = "$TINY_PREFIX/tiny"
          plutil -extract CFBundleDocumentTypes json -o - "$plist"
          cmp "$app/Contents/Resources/applet.icns" "$GITHUB_WORKSPACE/packaging/desktop/tiny.icns"
          sh -n "$app/Contents/Resources/open-tiny"
          cat "$app/Contents/Resources/open-tiny"
          grep -q -- "tiny' --hide-browser\"$" "$app/Contents/Resources/open-tiny"
      # And that it opens a file: tiny running, on it, in a window of
      # Terminal. A runner's desktop is not a person's, so this is said
      # rather than enforced.
      - name: Open a file with tiny.app
        continue-on-error: true
        env:
          TINY_PREFIX: ${{ runner.temp }}/tinybin
        run: |
          open -a "$HOME/Applications/tiny.app" "$GITHUB_WORKSPACE/CHANGELOG.md"
          for _ in $(seq 1 30); do
            if pgrep -f "$TINY_PREFIX/tiny --hide-browser $GITHUB_WORKSPACE/CHANGELOG.md" >/dev/null; then
              echo "tiny is running on CHANGELOG.md"
              pkill -f "$TINY_PREFIX/tiny" || true
              exit 0
            fi
            sleep 1
          done
          echo "tiny did not start"
          exit 1
      - name: Check that an uninstall takes tiny.app
        env:
          TINY_PREFIX: ${{ runner.temp }}/tinybin
        run: |
          echo y | "$TINY_PREFIX/tiny" --uninstall
          test ! -e "$HOME/Applications/tiny.app"
          test ! -e "$TINY_PREFIX/tiny"

  install-linux:
    name: install on Linux
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run install.sh
        env:
          TINY_REF: ${{ github.ref_name }}
          TINY_PREFIX: ${{ runner.temp }}/tinybin
          # Build rather than download, for the reason above.
          TINY_FROM_SOURCE: 1
        run: |
          cd "$RUNNER_TEMP"
          sh "$GITHUB_WORKSPACE/install.sh"
          "$TINY_PREFIX/tiny" --version
      # The menu entry, in the share beside the binary's folder (which for
      # ~/.local/bin is ~/.local/share), starting this binary, with its icon
      # in every size; then all of it gone after an uninstall.
      - name: Check the menu entry, and that an uninstall takes it
        env:
          TINY_PREFIX: ${{ runner.temp }}/tinybin
        run: |
          share="$RUNNER_TEMP/share"
          entry="$share/applications/tiny.desktop"
          cat "$entry"
          grep -qxF "Exec=\"$TINY_PREFIX/tiny\" --hide-browser %f" "$entry"
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils >/dev/null
          desktop-file-validate "$entry"
          test -f "$share/icons/hicolor/scalable/apps/tiny.svg"
          test -f "$share/icons/hicolor/48x48/apps/tiny.png"
          echo y | "$TINY_PREFIX/tiny" --uninstall
          test ! -e "$entry"
          test ! -e "$share/icons/hicolor/48x48/apps/tiny.png"
          test ! -e "$TINY_PREFIX/tiny"

  # The install line exactly as the README gives it: nothing forced, so it
  # takes the newest release for the machine it is on, and builds only where
  # there is none. The three jobs above test the commit; this one tests the
  # line on the front page, on all three systems it promises.
  install-release:
    name: one-line install on ${{ matrix.os }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Run install.sh
        if: runner.os != 'Windows'
        env:
          TINY_PREFIX: ${{ runner.temp }}/tinybin
        run: |
          cd "$RUNNER_TEMP"
          sh "$GITHUB_WORKSPACE/install.sh"
          "$TINY_PREFIX/tiny" --version
      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TINY_PREFIX: ${{ runner.temp }}\tinybin
        run: |
          Set-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\install.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:TINY_PREFIX\tiny.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # The README leads with screenshots, and a moved file turns them into broken
  # images on the front page of the project, which is the one page everybody
  # sees and nobody tests.
  pictures:
    name: the README's pictures are there
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every image the README points at
        run: |
          missing=0
          for image in $(grep -o 'docs/[A-Za-z0-9_-]*\.png' README.md | sort -u); do
            if [ -f "$image" ]; then
              echo "ok      $image"
            else
              echo "MISSING $image"
              missing=1
            fi
          done
          exit $missing
