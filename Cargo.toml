[package]
name = "tiny"
version = "0.1.1"
edition = "2024"
# Let-chains, which this uses throughout, landed in 1.88.
rust-version = "1.88"
description = "A personal knowledge manager that lives entirely in the terminal"
repository = "https://github.com/mattsaund/tiny"
license = "MIT"
readme = "README.md"
keywords = ["tui", "notes", "markdown", "knowledge-management", "editor"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.1.4"
tree-sitter = "0.26.13"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-tags = "0.26.13"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
