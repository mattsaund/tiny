[package]
name = "tiny"
version = "0.6.2"
edition = "2024"
# Let-chains, which this uses throughout, landed in 1.88.
rust-version = "1.88"
description = "A personal knowledge manager that lives entirely in the terminal"
repository = "https://github.com/mattsaund/tiny"
license = "MIT"
readme = "README.md"
keywords = ["tui", "notes", "markdown", "knowledge-management", "editor"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
# Plugins. Lua 5.4 is compiled into the binary from source (`vendored`), so a
# plugin needs nothing installed to run (see `plugins`).
mlua = { version = "0.12.1", default-features = false, features = ["lua54", "vendored"] }
# The terminal in a pane (see `shell`): a pseudo-terminal to run the shell in,
# a ConPTY on Windows, and a terminal emulator to keep the screen it draws.
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
# Patterns in search and replace (see `search`). Already in the build for
# tree-sitter, with these same features.
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-themes", "dump-load", "regex-fancy"] }
toml = "1.1.4"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-tags = "0.26.13"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
vt100 = "0.18.1"

# The clipboard (see `clipboard`). Already in the build for other crates;
# these features add only the few functions it calls.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[dev-dependencies]
# Reads `cargo metadata` when the third-party notices are written (see
# `licenses`). Already in the build for other crates; never in the binary.
serde_json = "1.0.151"
tempfile = "3.27.0"

# Release is what people install. `install.sh` downloads it ready-made, so
# what this profile costs in build time is paid once, by the release
# workflow, and again only by whoever builds from source.
#
# So the whole program is optimized as one unit (`lto = "fat"`, one codegen
# unit), which lets the optimizer see across every crate boundary at once. It
# made the binary 0.70 MB smaller than thin LTO across sixteen units did, and
# a clean build 36 seconds instead of 14.
#
# `strip` drops symbols that only a debugger would want, and takes about 2 MB
# off the binary.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# No unwinding. A panic in tiny is a bug with nothing to recover to: nothing
# catches one, and the terminal is given back by a hook rather than by a
# destructor (see `hand_back_the_terminal_on_panic`), so unwinding was only
# ever paying for tables nobody read. Dropping them is 0.42 MB of the binary.
# Tests are built with the dev profile and still unwind, so `#[should_panic]`
# would go on working if anything here ever wanted it.
panic = "abort"

# Optimized for size rather than speed: code nobody waits on. Reading the
# config, running a plugin's Lua, starting the shell in the terminal pane and
# describing an error each run when asked, not while anything is drawn. The
# grammars behind the project map are not here: the map is built while you
# wait, and at this setting it took 40% longer. Together, 0.16 MB.
[profile.release.package.toml]
opt-level = "s"
[profile.release.package.toml_parser]
opt-level = "s"
[profile.release.package.toml_datetime]
opt-level = "s"
[profile.release.package.toml_writer]
opt-level = "s"
[profile.release.package.serde_spanned]
opt-level = "s"
[profile.release.package.mlua]
opt-level = "s"
[profile.release.package.mlua-sys]
opt-level = "s"
[profile.release.package.portable-pty]
opt-level = "s"
[profile.release.package.serial2]
opt-level = "s"
[profile.release.package.anyhow]
opt-level = "s"
